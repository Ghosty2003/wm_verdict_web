<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WM-Verdict Annotation</title>
<style>
:root{
  --bg:#f6f7f9; --fg:#1c1e21; --card:#ffffff; --line:#e3e5e8; --accent:#2563eb;
  --muted:#6b7280; --ok:#16a34a; --warn:#d97706;
  --imag:#7c3aed; --imag-bg:#f5f0ff; --real:#0f766e; --real-bg:#effaf8; --none-bg:#f1f2f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --fg:#e8eaed; --card:#1a1e24; --line:#2a2f37; --accent:#60a5fa;
    --muted:#9aa2ad; --ok:#4ade80; --warn:#fbbf24;
    --imag:#b49cff; --imag-bg:#221b33; --real:#4fd1c0; --real-bg:#14282a; --none-bg:#1f242b;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e8eaed; --card:#1a1e24; --line:#2a2f37; --accent:#60a5fa;
  --muted:#9aa2ad; --ok:#4ade80; --warn:#fbbf24;
  --imag:#b49cff; --imag-bg:#221b33; --real:#4fd1c0; --real-bg:#14282a; --none-bg:#1f242b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,"Noto Sans SC",sans-serif;padding:0 16px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 0 64px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
input,select,button,textarea{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:360px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.desc{border-left:3px solid var(--accent);padding:4px 12px;margin:6px 0;font-size:14px}
.desc b{display:inline-block;min-width:110px}
.same{font-weight:600;margin:8px 0 4px}
.refbox3{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.refrow{border:3px solid;border-radius:10px;padding:6px 8px 8px}
.refrow.ok{border-color:#1f8a4c}
.refrow.mid{border-color:#d9a106}
.refrow.bad{border-color:#c0392b}
.refrow h3{margin:0 0 6px;font-size:14px}
.refrow.ok h3{color:#1f8a4c}
.refrow.mid h3{color:#b8860b}
.refrow.bad h3{color:#c0392b}
.refrow .ex{display:flex;flex-wrap:wrap;gap:10px}
.refpair{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:220px;max-width:100%}
.refpair img{width:100%;border-radius:5px;background:#000;cursor:zoom-in;display:block}
.refcap{font-size:11px;color:var(--muted);margin-top:4px}
figure{margin:0}
figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.mrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--card)}
.mrow > h2{font-size:16px;margin:0 0 8px}
.mrow > h2 .tag{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 10px}
.parts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){ .parts{grid-template-columns:1fr} }
.part{border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.part h3{font-size:13px;margin:0 0 6px;letter-spacing:.02em}
.part.real{border-color:var(--real);background:var(--real-bg)} .part.real h3{color:var(--real)}
.part.imag{border-color:var(--imag);background:var(--imag-bg)} .part.imag h3{color:var(--imag)}
.part.none{border-style:dashed;background:var(--none-bg);color:var(--muted)}
.part.active{box-shadow:0 0 0 3px var(--warn)}
.part img.judged,.part canvas.judged{width:100%;border-radius:6px;display:block;cursor:zoom-in}
.part img.judged{border:1px solid var(--line);background:#000}
.part.imag img.judged{max-width:340px;margin:0 auto}
.q{font-weight:600;margin:8px 0 4px;font-size:14px}
.crit{font-size:12px;color:var(--muted);margin:0 0 2px}
.warnline{font-size:12px;font-weight:600;margin:0 0 6px}
.labels{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.labels button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:5px 10px;font-size:14px}
.labels button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.state{font-size:12px;font-weight:600}
.state.done{color:var(--ok)} .state.todo{color:var(--warn)}
.meta{font-size:12px;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.kbd{font-size:12px;color:var(--muted)}
.kbd b{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:600}
.err{color:#dc2626;font-size:13px;white-space:pre-wrap}
textarea{font-size:13px;padding:4px 8px;margin-top:4px}
.part.none{font-size:13px}
a{color:var(--accent)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lightbox img{max-width:98vw;max-height:96vh}
</style>
</head>
<body>
<div class="wrap">
  <h1>WM-Verdict Human Annotation</h1>
  <div class="sub">One page = one test case, run by four models. Judge each REAL execution and each IMAGINED last frame on its own.</div>

  <div id="login" class="panel" hidden>
    <h3 style="margin-top:0">Sign in</h3>
    <div class="row" style="max-width:460px">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password (min 6 characters)">
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnLogin">Sign in</button>
      <button id="btnSignup" class="ghost">First time? Sign up</button>
      <button id="btnMagic" class="ghost">Email me a login link</button>
    </div>
    <p id="loginMsg" class="err"></p>
  </div>

  <div id="app" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <span id="who" class="meta"></span>
          <select id="cellSel" title="Task × perturbation level"></select>
          <select id="groupSel" title="Group"></select>
        </div>
        <button id="btnLogout" class="ghost">Sign out</button>
      </div>
      <div class="prog"><i id="progBar" style="width:0%"></i></div>
      <div class="meta" id="progTxt"></div>
    </div>

    <div id="pagePanel" class="panel" hidden>
      <div class="desc" id="taskDesc"></div>
      <div class="desc" id="pertDesc"></div>
      <div class="desc" id="caseDesc"></div>
      <p class="same" id="sameNote">Same task and same perturbation. Each row is one closed-loop run of that model.</p>
      <div id="refbox" class="refbox3"></div>
      <div id="rows"></div>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <div class="row">
          <button id="btnPrev" class="ghost">← Previous</button>
          <button id="btnNext" class="ghost">Next →</button>
        </div>
        <span class="kbd"><b>1</b>–<b>4</b> answer highlighted · <b>←</b>/<b>→</b> previous / next group</span>
      </div>
      <p id="saveMsg" class="meta"></p>
    </div>
  </div>
  <p id="fatal" class="err"></p>
</div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt="zoom"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=4"></script>
<script>
const C = window.WMV_CONFIG || {};
let sb;
try { sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY); }
catch (e) { document.getElementById("fatal").textContent = "config.js is missing the Supabase project settings."; }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const MODEL_NAME = { lingbot: "LingBot-VA", openwam: "OpenWAM-α", cosmos: "Cosmos Policy", uva: "UVA" };
// 入库照旧（2026-11-15 同卷改版）：REAL 区 = round 2 的卡，IMAGINED 区 = round 3 的卡，按 unit_id 对应；
// 页面结构（哪一页放哪几张卡）由 data/samecase_pages.json 给出，数据库结构不变。
const ROUND_REAL = 2, ROUND_IMAG = 3;
const PAGES_URL = "data/samecase_pages.json?v=4";

const TASK_INFO = {
  t5: { title: "Put the book into the BACK compartment of the caddy", crit: "the book stands fully down inside the BACK compartment of the caddy, released by the gripper (top of the book at or below the caddy rim). NOT completed: book still held or hanging above the rim, lying across the rim, tilted half out, in a front compartment, or on the table. If the book cannot be seen anywhere (not on the table, not in the gripper, not in a front compartment) while the gripper is over or inside the back compartment, answer borderline" },
  t3: { title: "Put the black bowl into the bottom drawer and close it", crit: "the black bowl is inside the bottom drawer AND the drawer is fully closed (a white gap line along the drawer front means it is NOT fully closed)" },
  t2: { title: "Turn on the stove and put the moka pot on it", crit: "the stove is turned ON AND the moka pot is standing on the stove" },
  t4: { title: "White mug on the LEFT plate, yellow-and-white mug on the RIGHT plate", crit: "the white mug is on the LEFT plate AND the yellow-and-white mug is on the RIGHT plate" },
  t6: { title: "White mug on the plate, chocolate pudding to the right of the plate", crit: "the white mug is ON the plate AND the chocolate pudding is to the RIGHT of the plate" },
};
const KSTEP = [60, 160, 260], KCM = [2, 5, 10];
function pertText(lv){
  const n = +(lv.match(/\d+$/) || [0])[0];
  if (lv === "none") return "No perturbation (baseline).";
  if (lv === "B0") return "B0 control: protocol render path, no image corruption.";
  if (/^A\d$/.test(lv)) return `Initial object displacement ${lv} (A0 / A1 = within the training range; A2 → A4 = progressively further outside it).`;
  if (/^P\d$/.test(lv)) return `Initial arm pose offset ${lv} (P0 → P4 = progressively larger offset of the robot's starting joint configuration).`;
  if (/^O\d$/.test(lv)) return `Occlusion ${lv}: a black square (centered; side = 1/16 → 5/16 of the image height for O1 → O5) is pasted onto the main-camera frame of the model's FIRST planning input only. Later frames are not occluded (a model that re-reads past frames from its history window can still see that one occluded frame). Only the model's input changes.`;
  if (/^Em\d$/.test(lv)) return `Physics: target-object mass × ${[1.5, 2, 4, 8][n-1]} (${lv}).`;
  if (/^Ef\d$/.test(lv)) return `Physics: contact friction × ${[0.8, 0.6, 0.4, 0.2][n-1]} (${lv}).`;
  if (/^G\d$/.test(lv)) return `Action gain × ${[0.9, 0.75, 0.55, 0.4][n-1]} (${lv}): every commanded action is scaled down, so the robot moves less than the model commanded.`;
  if (/^K\d$/.test(lv)) return `External push (${lv}): right after env step ${KSTEP[Math.floor((n-1)/3)]} the target object is pushed by ${KCM[(n-1)%3]} cm. The model only sees the consequences.`;
  if (/^F\d+$/.test(lv)) return `Blindness (${lv}): at the first planning call at or after env step ${n}, the main camera frame the model reads is blacked out once (wrist camera and imagination untouched).`;
  if (lv === "N1_1") return "Action-stream fault N1: one zero action at env step 50.";
  if (/^NR\d$/.test(lv)) return `Action-stream fault ${lv}: each step's action is replaced by zero with p = ${[5, 10, 20, 30, 40][n-1]} %.`;
  if (/^NLw\d$/.test(lv)) return `Action-stream fault ${lv}: commands are executed ${[4, 8, 16, 32, 64][n-1]} env steps late.`;
  if (/^NL\d$/.test(lv)) return `Action-stream fault ${lv}: commands are executed ${n} env step(s) late.`;
  const B = { Bg: "gaussian blur", Bf: "fog", Bz: "zoom blur" }[lv.slice(0, 2)];
  if (B) return `Image corruption ${lv}: ${B}, severity ${n} (of 2 / 5 / 9). Every frame the model reads is corrupted; only the model's input changes.`;
  return `Perturbation ${lv}.`;
}
const REAL_Q = "Did the real execution complete the task? (judge the boxed final frame)";
const IMAG_Q = "Does the imagined frame show the task completed?";
const IMAG_WARN = "The world model's own prediction at its last planning call — not a camera frame. Judge this image on its own.";

let me = null, P = null, pages = [], cells = [], cardOf = new Map(), mine = new Map(), idx = 0, nQ = 0;
const drafts = new Map();

function setImg(el, local){
  const c = [].concat(local); let i = 0;
  el.onerror = () => { if (++i < c.length) el.src = c[i]; else el.onerror = null; };
  el.src = c[0];
}
// REAL 帧条（13 帧横排、最后一帧前留 6px 白、黄框）→ 每行 4 格的网格，在浏览器里切开重排，不改图片文件
function toGrid(img){
  const N = 13, GAP = 6, W = img.naturalWidth, H = img.naturalHeight, fw = Math.round((W - GAP) / N);
  if (!W || Math.abs(fw - H) > H * 0.6) return;             // 不是标准帧条就原样显示
  const cols = 4, rows = Math.ceil(N / cols), pad = 6;
  const c = document.createElement("canvas");
  c.width = cols * fw + (cols - 1) * pad; c.height = rows * H + (rows - 1) * pad;
  const g = c.getContext("2d");
  for (let i = 0; i < N; i++) {
    const sx = i * fw + (i === N - 1 ? GAP : 0);
    g.drawImage(img, sx, 0, i === N - 1 ? W - sx : fw, H, (i % cols) * (fw + pad), Math.floor(i / cols) * (H + pad), i === N - 1 ? W - sx : fw, H);
  }
  c.className = "judged"; c.title = "frames 1–13 in time order; the boxed one is the final frame";
  c.onclick = () => zoom(c.toDataURL());
  img.replaceWith(c);
}
function zoom(src){ $("lightboxImg").src = src; $("lightbox").style.display = "flex"; }
function qsOf(p){ const out = []; p.rows.forEach(r => { if (r.realCard) out.push(r.realCard); if (r.imagCard) out.push(r.imagCard); }); return out; }
function pageDone(p){ return qsOf(p).every(c => mine.has(c.id)); }

async function init(){
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  session ? enter(session.user) : showLogin();
}
function showLogin(){ $("login").hidden = false; $("app").hidden = true; }
function creds(needPw){
  const email = $("email").value.trim(), password = $("password").value;
  if (!email) { $("loginMsg").textContent = "Please enter your email first (if the browser autofilled it, click the field and retype)."; return null; }
  if (needPw && password.length < 6) { $("loginMsg").textContent = "Please enter a password (at least 6 characters)."; return null; }
  return { email, password };
}
$("btnLogin").onclick = async () => {
  const c = creds(true); if (!c) return;
  const { error } = await sb.auth.signInWithPassword(c);
  $("loginMsg").textContent = error ? "Sign-in failed: " + error.message : "";
  if (!error) init();
};
$("btnSignup").onclick = async () => {
  const c = creds(true); if (!c) return;
  const { error } = await sb.auth.signUp(c);
  $("loginMsg").textContent = error ? "Sign-up failed: " + error.message
    : "Account created. Now click Sign in. (If email confirmation is enabled, check your inbox first.)";
};
$("btnMagic").onclick = async () => {
  const c = creds(false); if (!c) return;
  const { error } = await sb.auth.signInWithOtp({ email: c.email, options: { emailRedirectTo: location.href } });
  $("loginMsg").textContent = error ? "Sending failed: " + error.message : "Login link sent — open the email and click it.";
};
$("btnLogout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function enter(user){
  me = user;
  $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = user.email;
  if (!C.OPEN_ACCESS) {
    const { data: allowed, error } = await sb.from("allowed_emails").select("email").eq("email", user.email);
    if (error || !allowed || !allowed.length) {
      $("app").hidden = true; $("login").hidden = false;
      $("loginMsg").textContent = "This email is not on the invite list — please contact the organizer.";
      return;
    }
  }
  await loadAll();
}

// 加载提速（2026-11-23）：原来卡片按 1000 条一批、标注按 400 个 id 一批全部串行（约 45 次往返）。
// 现在：卡片先取总数再并行拉各批；标注只按当前用户查（通常 1 次）；页面表 / 卡片 / 标注三路同时发。
const STEP = 1000;
async function fetchCards(){
  const base = () => sb.from("cards").select("id,round_id,unit_id,model,task,level,label_set").in("round_id", [ROUND_REAL, ROUND_IMAG]);
  const { count, error } = await sb.from("cards").select("id", { count: "exact", head: true }).in("round_id", [ROUND_REAL, ROUND_IMAG]);
  if (error) throw error;
  const n = Math.ceil((count || 0) / STEP) || 1;
  const parts = await Promise.all(Array.from({ length: n }, (_, k) =>
    base().order("id").range(k * STEP, k * STEP + STEP - 1).then(({ data, error }) => { if (error) throw error; return data || []; })));
  const out = parts.flat();
  if (out.length < (count || 0)) throw new Error(`cards: got ${out.length} of ${count}`);
  return out;
}
async function fetchMine(){
  const out = [];
  for (let from = 0; ; from += STEP) {
    const { data, error } = await sb.from("annotations").select("card_id,label,note").eq("user_id", me.id).order("card_id").range(from, from + STEP - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < STEP) return out;
  }
}

async function loadAll(){
  let all, myAnn;
  try {
    [P, all, myAnn] = await Promise.all([
      fetch(PAGES_URL).then(r => { if (!r.ok) throw new Error("page table " + r.status); return r.json(); }),
      fetchCards(), fetchMine()]);
  } catch (e) { $("fatal").textContent = "Could not load: " + (e.message || e); return; }
  cardOf = new Map(all.map(c => [`${c.round_id}|${c.unit_id}`, c]));
  pages = P.pages.map(p => ({ ...p, rows: p.rows.map(r => ({ ...r,
    realCard: r.real ? cardOf.get(`${ROUND_REAL}|${r.real}`) || null : null,
    imagCard: r.imag ? cardOf.get(`${ROUND_IMAG}|${r.imag}`) || null : null })) }));
  const ids = [...new Set(pages.flatMap(p => qsOf(p).map(c => c.id)))];
  nQ = ids.length;
  const idSet = new Set(ids);
  mine = new Map();
  myAnn.forEach(a => { if (idSet.has(a.card_id)) mine.set(a.card_id, a); });
  const seen = new Map();
  pages.forEach((p, i) => { const k = `${p.T}|${p.level}`; if (!seen.has(k)) seen.set(k, { key: k, T: p.T, task: p.task, level: p.level, first: i, idx: [] }); seen.get(k).idx.push(i); });
  cells = [...seen.values()];
  fillCellSel();
  idx = pages.findIndex(p => !pageDone(p)); if (idx < 0) idx = 0;
  render();
}
function cellOf(i){ const p = pages[i]; return cells.findIndex(c => c.key === `${p.T}|${p.level}`); }
function fillCellSel(){
  $("cellSel").innerHTML = cells.map((c, i) => {
    const qs = c.idx.flatMap(j => qsOf(pages[j])), d = qs.filter(q => mine.has(q.id)).length;
    return `<option value="${i}">${esc(c.T)} (${esc(c.task)}) · ${esc(c.level === "none" ? "baseline" : c.level)} — ${d}/${qs.length}</option>`;
  }).join("");
}
$("cellSel").onchange = e => { const c = cells[+e.target.value]; const j = c.idx.find(k => !pageDone(pages[k])); idx = j == null ? c.idx[0] : j; render(); };
$("groupSel").onchange = e => { idx = cells[cellOf(idx)].idx[+e.target.value]; render(); };
function step(dir){ const j = idx + dir; if (j >= 0 && j < pages.length) { idx = j; render(); } }

function partHTML(kind, r, card){
  if (!card) {
    const why = !r[kind] ? (r.in_cell ? "No data" : "Not run under this condition") : "Not in the database yet";
    return `<div class="part none"><h3>${kind === "real" ? "REAL" : "IMAGINED"}</h3>${esc(why)}</div>`;
  }
  const cur = mine.get(card.id);
  const btns = (card.label_set || []).map((l, i) => `<button data-card="${card.id}" data-l="${esc(l)}" class="${cur && cur.label === l ? "sel" : ""}"><b>${i + 1}</b> ${esc(l)}</button>`).join("");
  const note = `<textarea data-note="${card.id}" rows="1" placeholder="Note (optional)">${esc(drafts.has(card.id) ? drafts.get(card.id) : (cur && cur.note) || "")}</textarea>`;
  const img = `<img class="judged" data-img="${card.id}" data-round="${card.round_id}" data-uid="${esc(card.unit_id)}" alt="${kind === "real" ? "real frame strip" : "imagined last frame"}">`;
  if (kind === "real")
    return `<div class="part real" data-q="${card.id}"><h3>REAL</h3>${img}
      <p class="q">${esc(REAL_Q)}</p><div class="labels">${btns}</div>${note}</div>`;
  return `<div class="part imag" data-q="${card.id}"><h3>IMAGINED</h3>${img}
    <p class="q">${esc(IMAG_Q)}</p><div class="labels">${btns}</div>${note}</div>`;
}
function activeCard(p){ for (const c of qsOf(p)) if (!mine.has(c.id)) return c.id; return null; }

function render(){
  const answered = [...new Set(pages.flatMap(p => qsOf(p).map(c => c.id)))].filter(id => mine.has(id)).length;
  $("progBar").style.width = nQ ? (100 * answered / nQ) + "%" : "0%";
  $("progTxt").textContent = `${answered} / ${nQ} questions answered · ${pages.length} pages (${cells.length} conditions × up to 5 groups)`;
  if (!pages.length) { $("pagePanel").hidden = true; return; }
  $("pagePanel").hidden = false;
  const p = pages[idx], ci = cellOf(idx), cell = cells[ci];
  $("cellSel").value = ci;
  $("groupSel").innerHTML = cell.idx.map((j, k) => `<option value="${k}">Group ${k + 1} / ${cell.idx.length}${pageDone(pages[j]) ? " ✓" : ""}</option>`).join("");
  $("groupSel").value = cell.idx.indexOf(idx);
  const ti = TASK_INFO[p.task] || { title: p.task };
  $("taskDesc").innerHTML = `<b>Task ${esc(p.T)}</b> ${esc(ti.title)}${ti.crit ? ` — completed = ${esc(ti.crit)}` : ""}`;
  $("pertDesc").innerHTML = `<b>Perturbation</b> ${esc(pertText(p.level))}`;
  $("caseDesc").innerHTML = `<b>Group</b> ${esc(cell.idx.indexOf(idx) + 1)} of ${esc(cell.idx.length)} for this condition`;
  renderRefs(p.task);
  const act = activeCard(p);
  $("rows").innerHTML = p.rows.map(r => `<section class="mrow"><h2><span class="tag">${esc(MODEL_NAME[r.model] || r.model)}</span></h2>
    <div class="parts">${r.note ? `<div class="part none">${esc(r.note)}</div>`
      : partHTML("real", r, r.realCard) + partHTML("imag", r, r.imagCard)}</div></section>`).join("");
  if (act) { const el = document.querySelector(`.part[data-q="${act}"]`); if (el) el.classList.add("active"); }
  document.querySelectorAll("#rows img.judged").forEach(el => {
    const d = `cards/r${el.dataset.round}/${el.dataset.uid}`;
    setImg(el, [d + ".webp", d + ".png"]); el.onclick = () => zoom(el.src);
    if (el.dataset.round === String(ROUND_REAL)) el.onload = () => toGrid(el);
  });
  document.querySelectorAll("#rows .labels button").forEach(b => b.onclick = () => save(+b.dataset.card, b.dataset.l));
  document.querySelectorAll("#rows textarea[data-note]").forEach(t => t.oninput = () => drafts.set(+t.dataset.note, t.value));
  const qs = qsOf(p), n = qs.filter(c => mine.has(c.id)).length;
  $("saveMsg").textContent = qs.length ? `${n} / ${qs.length} answered on this page` : "";
}
async function save(cardId, label){
  const t = document.querySelector(`textarea[data-note="${cardId}"]`);
  const rec = { card_id: cardId, user_id: me.id, email: me.email, label, note: (t && t.value) || null, updated_at: new Date().toISOString() };
  const { error } = await sb.from("annotations").upsert(rec, { onConflict: "card_id,user_id" });
  if (error) { $("saveMsg").textContent = "Save failed: " + error.message; return; }
  mine.set(cardId, rec); drafts.delete(cardId);
  const y = window.scrollY;
  fillCellSel(); render(); window.scrollTo(0, y);
}
$("btnPrev").onclick = () => step(-1);
$("btnNext").onclick = () => step(1);
// 参考例（cards/ref3/，来源见 cards/ref3/provenance.json）：每个任务若干成功 / 1 个 borderline / 若干失败，每例主视角 + 腕部视角
// 2026-11-24：borderline 按判别规则（judge_prompt.md）定义；原 T0/T1/T4 的“快完成”例按规则属失败，移入 FAILURE 行
const REF_N = { t5: { success: 3, borderline: 0, fail: 6 }, t3: { success: 2, borderline: 0, fail: 4 },
  t2: { success: 2, borderline: 1, fail: 2 }, t4: { success: 2, borderline: 1, fail: 3 }, t6: { success: 2, borderline: 0, fail: 4 } };
const REF_CAP = { t5_fail5: "almost done — still FAILURE", t3_fail3: "almost done — still FAILURE", t6_fail3: "almost done — still FAILURE" };
const REF_ROWS = [
  ["success", "ok", "✓ SUCCESS — every task condition is clearly satisfied", ""],
  ["borderline", "mid", "~ BORDERLINE — you cannot decide between success and not",
   "Use it when the task looks complete but the image shows generation distortion (missing corner, warped object, melted gripper), or when the key part is hidden / sits right at the edge as the task rules describe. “Almost done but not finished” is NOT borderline — it is a failure."],
  ["fail", "bad", "✗ FAILURE — clearly not satisfied (including “almost done”)", ""]];
let refTask = null;
function renderRefs(task){
  if (task === refTask) return; refTask = task;
  const n = REF_N[task] || { success: 0, borderline: 0, fail: 0 };
  $("refbox").innerHTML = REF_ROWS.map(([k, cls, title, rule]) => `<div class="refrow ${cls}"><h3>${title}</h3>` +
    (rule ? `<p class="refcap" style="font-size:12px;margin:0 0 6px">${esc(rule)}</p>` : "") + `<div class="ex">` +
    Array.from({ length: n[k] }, (_, j) => `<div><div class="refpair"><img data-ref="cards/ref3/${task}_${k}${j}_main.png?v=2" alt="${k} example ${j + 1}, main camera">` +
      `<img data-ref="cards/ref3/${task}_${k}${j}_wrist.png?v=2" alt="${k} example ${j + 1}, wrist camera"></div>` +
      `<div class="refcap">${esc(REF_CAP[`${task}_${k}${j}`] || "main · wrist")}</div></div>`).join("") +
    `</div></div>`).join("");
  document.querySelectorAll("#refbox img[data-ref]").forEach(el => { setImg(el, el.dataset.ref); el.onclick = () => zoom(el.src); });
}
document.addEventListener("keydown", e => {
  if ($("pagePanel").hidden || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (/^[1-4]$/.test(e.key)) {
    const el = document.querySelector("#rows .part.active");
    const b = el && el.querySelectorAll(".labels button")[+e.key - 1];
    if (b) b.click();
  }
});
init();
</script>
